model:
  name: efficientnet_lstm_v2     
  num_classes: 2
  pretrained: true

train:
  epochs: 30
  warmup_epochs: 5
  batch_size: 2
  optimizer: adamw      
  lr: !!float "1e-4"
  min_lr: !!float "1e-6"
  pos_weight: 0.5
  weight_decay: !!float "1e-4"
  ckpt: None

data:
  root_dir: data       
  num_workers: 4
